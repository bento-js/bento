name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    # `mise run check` is the one definition of the blocking gate. The pre-push hook
    # runs the same task, so the local gate and this one cannot drift apart.
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            # Oxfmt, Oxlint, tsrs, tsc, Vitest and VitePress are devDependencies, so
            # `check` needs them.
            - run: mise run deps:install
            - run: mise run check

    commits:
        name: Commit messages
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - name: Validate pull request commit messages
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node tools/check-pr-commits.ts "$BASE_SHA" "$HEAD_SHA"

    # The release pull request consumes changesets instead of adding one, so it is exempt.
    changeset:
        name: Changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - run: mise run deps:install
            - name: Require a changeset
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node tools/require-changeset.ts "$BASE_SHA" "$HEAD_SHA"

    rust:
        # Bento supports only macOS on Apple silicon for now.
        runs-on: xcode-27
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            # mise-action caches only mise's data directory, so a restore can bring
            # back mise's "rust is installed" marker without the toolchain behind it.
            # rust-cache covers the part that is actually slow.
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - uses: Swatinem/rust-cache@v2
            - name: Record native platform and SDK
              run: |
                  sw_vers
                  xcrun --sdk macosx --show-sdk-version
                  xcrun swift --version
            - run: mise run rust
            - name: Check standalone core without native or engine dependencies
              run: cargo check --locked -p bento_prompt --no-default-features --lib
            - name: Check standalone native core and Rust example
              env:
                  MACOSX_DEPLOYMENT_TARGET: "27.0"
              run: |
                  cargo test --locked -p bento_prompt --features foundation-models --lib
                  cargo build --locked -p bento_prompt --features foundation-models --example prompt_session
            - name: Build native CLI preview
              run: |
                  cargo build --locked -p bento_cli
                  build_version="$(xcrun vtool -show-build target/debug/bento)"
                  printf '%s\n' "$build_version"
                  case "$build_version" in
                      *"minos 27.0"*) ;;
                      *) echo "The native CLI must declare minos 27.0"; exit 1 ;;
                  esac
                  tar -czf bento-macos27-arm64-prompt.tar.gz -C target/debug bento
            - uses: actions/upload-artifact@v7
              with:
                  name: bento-macos27-arm64-prompt
                  path: bento-macos27-arm64-prompt.tar.gz
                  if-no-files-found: error

    rust-backend-free:
        runs-on: macos-26
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@v7
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - uses: Swatinem/rust-cache@v2
              with:
                  key: backend-free
            - name: Record backend-free platform and SDK
              run: |
                  sw_vers
                  xcrun --sdk macosx --show-sdk-version
            - name: Check backend-free workspace
              run: |
                  cargo clippy --workspace --all-targets --no-default-features -- -D warnings
                  RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-default-features --no-deps
                  cargo test --workspace --no-default-features --no-fail-fast
            - name: Check standalone backend-free core
              run: cargo test --locked -p bento_prompt --no-default-features --lib
            - name: Build backend-free CLI preview
              run: |
                  cargo build --locked -p bento_cli --no-default-features
                  xcrun vtool -show-build target/debug/bento
                  tar -czf bento-macos26-arm64-backend-free.tar.gz -C target/debug bento
            - uses: actions/upload-artifact@v7
              with:
                  name: bento-macos26-arm64-backend-free
                  path: bento-macos26-arm64-backend-free.tar.gz
                  if-no-files-found: error
