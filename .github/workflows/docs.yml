# Publishes the documentation site from the default branch to the root of `gh-pages`, alongside
# the per-pull-request previews that live under `pr-preview/`.
#
# PRIVACY — READ BEFORE ADOPTING
#
# This publishes your guides to the public internet. The kit's default is that guides are
# private, and this workflow is the one place that default can be broken by accident.
#
# The job is therefore gated on the repository being public. A private repository will skip it
# rather than publish, and GitHub Pages cannot serve privately outside Enterprise anyway. If your
# guides must stay private and you still want them rendered, publish to Cloudflare instead
# (`workbench project init --site cloudflare`), which can gate a site behind Cloudflare Access.

name: Docs

on:
    push:
        branches: [main]
    workflow_dispatch:

# A newer commit on the default branch supersedes an older deploy; cancelling the stale one is
# correct. Previews use a separate per-pull-request group and write under `pr-preview/`, which
# `clean-exclude` below protects.
concurrency:
    group: docs-production
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    publish:
        if: ${{ !github.event.repository.private }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: jdx/mise-action@v5

            # Pages serves this repository at /<name>/, so the site's base URL must match or every
            # asset and link resolves against the domain root. Hugo reads HUGO_BASEURL in place of
            # `baseURL` in docs/hugo.toml. A custom Pages domain needs its own URL here.
            - run: mise run docs:build
              env:
                  HUGO_BASEURL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            # `clean` removes files no longer in the build, which would take the preview umbrella
            # directory with it. Excluding `pr-preview` lets the production site and the open
            # previews share one branch.
            - uses: JamesIves/github-pages-deploy-action@v4.9.0
              with:
                  branch: gh-pages
                  folder: docs/public
                  clean: true
                  clean-exclude: pr-preview
                  commit-message: "Deploy documentation from ${{ github.sha }}"
