[package]
name = "bento_cli"
description = "The bento command: run scripts and project tasks, and install dependencies"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "bento"
path = "src/main.rs"

[dependencies]
ariadne = "0.6.0"
bento_host.workspace = true
bento_package.workspace = true
bento_runtime.workspace = true
bento_task.workspace = true
bento_workspace.workspace = true
clap.workspace = true
notify = "8.2.0"
oxc_resolver.workspace = true
parking_lot.workspace = true
signal-hook.workspace = true
thiserror.workspace = true

# Exports the Node-API symbols from the `bento` executable, where native addons look them up.
[build-dependencies]
deno_napi.workspace = true

[dev-dependencies]
bento_test_support.workspace = true
libc.workspace = true
tempfile.workspace = true
serde_json.workspace = true
