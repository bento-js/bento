#:schema https://mise.jdx.dev/schema/mise.json
# mise owns the task graph. Every other tool is invoked from a task here, so the
# local gate and the CI gate cannot drift apart.
min_version = "2026.11.9"

[settings]
# Keep mise.lock current as tools change; `mise lock` regenerates it for exactly these
# platforms, so a fresh `mise install` never rewrites it. Bento builds and runs only on macOS
# with Apple silicon; CI's `check` job and the docs workflows run on Linux x64.
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-x64"]

[tools]
"github:markmals/workbench" = "3.0.1"
# hk's version must match the `amends`/`import` URLs in hk.pkl — bump both together.
hk = "2.8.1"
gh = "2.103.2"
actionlint = "1.7.12"
dprint = "0.64.3"
node = "26.12.1" # 26 or newer: tools/*.ts runs on native type stripping
pnpm = "12.15.0" # matches `packageManager` in package.json; keep the two in step
worktrunk = "0.81.0" # provides `wt`
# Beads is not in the mise registry; the GitHub release backend installs the same
# binary `brew install beads` does. Pin it: an older `bd` refuses to open a newer DB.
"github:gastownhall/beads" = "1.3.2" # provides `bd`
"github:knope-dev/knope" = { version = "0.24.0", version_prefix = "knope/v" }
"github:dmno-dev/varlock" = "1.25.0"
hugo = "0.170.0"
"github:CloudCannon/pagefind" = "1.6.0"
# Rust is pinned to the channel in rust-toolchain.toml — rustup reads that file for
# every `cargo` invocation, and the native release builds go through rustup directly.
# Change both together. `minimal` leaves out the offline docs, which nothing here reads.
rust = { version = "1.99.0", profile = "minimal", components = "clippy,rustfmt" }

[env]
# Locally installed CLIs — oxfmt, oxlint, tsrs, tsc, vitest — without a `pnpm exec`
# prefix. They are devDependencies, never global installs.
_.path = ["{{config_root}}/node_modules/.bin"]
# Cargo turns colour off when it is not writing to a terminal, which hides it from
# task output and CI logs alike.
CARGO_TERM_COLOR = "always"

# ── The task interface every Workbench project implements ────────────────────

[tasks.setup]
description = "Idempotent first-run bootstrap: npm and Cargo dependencies, this machine's Beads replica, git hooks"
depends = ["deps:install"]
run = [
    # Downloads every crate Cargo.lock names, failing if the lockfile is out of date.
    "cargo fetch --locked",
    # A project that already has a Beads workspace restores this machine's replica from the
    # remote's `refs/dolt/data`; only a project without one creates it. `--skip-hooks` is
    # load-bearing: without it `bd init` points core.hooksPath at .beads/hooks, and every hook
    # hk installs is then ignored by git.
    "if [ -f .beads/config.yaml ]; then bd bootstrap --yes; else bd init --non-interactive --prefix bento --skip-agents --skip-hooks; fi",
    # Commit `.beads/issues.jsonl` so the work graph is reviewable in a diff.
    "bd config set export.auto true",
    # Syncs happen at the process's sync points (`mise run beads:sync`).
    "bd config set dolt.auto-push false",
    # hk owns every git hook (see hk.pkl). Never run `bd hooks install`.
    "hk install --mise",
]

[tasks.check]
description = "The single blocking gate: formatting, lint, types, tests, records, crate policy, the site"
alias = "c"
# `hk check --all` runs every step in hk.pkl: whitespace, newlines, merge conflicts,
# actionlint, dprint, Oxfmt, Oxlint, `cargo fmt --check`, and the `tsrs` step (which calls
# `mise run typecheck`). Formatting, linting and type checking are therefore already in
# this gate — adding them to `depends` would only run them twice. If you remove a step from
# hk.pkl, add it back here.
#
# The rest of the Rust gate is `mise run rust`, deliberately outside this task: Bento
# builds only on macOS with Apple silicon and the full suite takes minutes, so CI runs
# it in its own macOS jobs.
depends = ["test"]
run = ["hk check --all", "mise run validate", "mise run deps:policy", "mise run docs:build"]

[tasks.fmt]
alias = "f"
description = "Format in place with hk's fixers (dprint, Oxfmt, rustfmt); accepts file paths, all files when none"
usage = 'arg "[files]" help="Files to format" var=#true'
run = "hk fix ${usage_files:---all}"

[tasks.status]
description = "Where the work stands: current phase, next action, who acts, and Beads"
run = "workbench workflow status --output text"

[tasks.validate]
description = "Check the project's records and its Workbench setup"
run = ["workbench records validate --output text", "workbench project validate --output text"]

[tasks."beads:sync"]
description = "Sync this machine's Beads replica with the project's remote"
run = "workbench beads sync --output text"

[tasks."beads:claim"]
description = "Claim a Beads item as this machine and confirm the claim survived a sync: `mise run beads:claim -- <id>`"
run = "workbench beads claim --output text"

[tasks."beads:close"]
description = """Close a Beads item as this machine's claimant, then sync: `mise run beads:close -- <id> --reason "<reason>"`"""
run = "workbench beads close --output text"

# ── The TypeScript tooling ───────────────────────────────────────────────────

[tasks.test]
alias = "t"
description = "Run the crate-policy tool's tests and the benchmark harness's tests"
# The glob form, not `node --test tools/`: it names exactly what runs and does not
# depend on the runner's directory-discovery rules.
#
# `bench/` keeps Vitest: its suites mock modules with `vi.mock`/`vi.hoisted`, which
# `node:test` has no equivalent for. vitest.config.ts scopes Vitest to `bench/` so it
# never collects the `node:test` suites above.
run = ["node --test 'tools/**/*.test.ts'", "vitest run"]

[tasks.lint]
alias = "l"
description = "Lint with Oxlint (type-aware) and apply safe fixes"
# `--disable-nested-config`: fixtures/remix-guest-book is an independent project with
# its own .oxlintrc.jsonc, and Oxlint refuses to load a nested config that sets
# `options.typeAware`, even though .oxlintrc.jsonc here never lints that directory.
run = "oxlint --disable-nested-config --fix"

[tasks.typecheck]
description = "Typecheck with tsrs (the Rust port of tsc 7), and the Prompt API example with tsc"
# Three projects, because they hold their sources to different rules: `tools/*.ts` is run
# by `node --test` through type stripping and so must stay erasable, the root project is
# the benchmark harness, and the Prompt API example is checked with the real TypeScript
# compiler because that is what a consumer of `prompt.d.ts` runs.
run = ["tsrs", "tsrs -p tools/tsconfig.json", "tsc --project examples/prompt-api/tsconfig.json"]

[tasks."deps:install"]
description = "Install npm dependencies with the pinned pnpm"
run = "pnpm install --frozen-lockfile"

# ── Bento ────────────────────────────────────────────────────────────────────

[tasks."deps:policy"]
description = "Check that no crate depends on the SWC stack (policy.0001)"
run = "node tools/crate-dependencies.ts"

[tasks.rust]
description = "The Rust gate: rustfmt, clippy, rustdoc, and every crate's tests (macOS arm64)"
# Outside `check` on purpose — see the comment there. The deployment target matches the
# macOS version the default CLI build requires; `cargo fmt --check` needs neither it nor
# the SDK, which is why that one step also runs as an hk hook on every platform.
env = { MACOSX_DEPLOYMENT_TARGET = "27.0", RUSTDOCFLAGS = "-D warnings" }
run = [
    "cargo fmt --all --check",
    "cargo clippy --workspace --all-targets -- -D warnings",
    "cargo doc --workspace --no-deps",
    "cargo test --workspace --no-fail-fast",
]

[tasks.build]
alias = "b"
description = "Build the `bento` CLI from source"
run = "cargo build -p bento_cli"

[tasks.dev]
alias = "d"
description = "Run the CLI from source: `mise run dev -- run --allow-read=. main.ts`"
run = "cargo run -p bento_cli --"

# ── The record site ──────────────────────────────────────────────────────────

[tasks."docs:build"]
description = "Build the site into docs/public, then index it for search (HUGO_BASEURL sets a deployed base URL)"
run = ["hugo build --source docs --cleanDestinationDir", "pagefind --site docs/public"]

[tasks."docs:dev"]
description = "Serve the site with live reload; search needs `mise run docs:build`"
run = "hugo server --source docs"

# ── Releases ─────────────────────────────────────────────────────────────────

[tasks.package]
description = "Build one release archive of the `bento` CLI into artifacts/ (default: the macOS 27 build with the Prompt API backend)"
usage = '''
arg "[variant]" help="`default` (macOS 27, Foundation Models backend) or `backend-free` (--no-default-features)" default="default" {
    choices "default" "backend-free"
}
'''
# Writes `artifacts/<name>.tar.gz` holding `<name>/bento`, with `<name>` either `bento-<target>`
# or `bento-backend-free-<target>`; knope.toml explains why Mise installs the first.
# build-archives.yml builds each variant on the runner CI uses for it.
run = '''
#!/usr/bin/env bash
set -euo pipefail
target="$(rustc -vV | sed -n 's/^host: //p')"
case "$usage_variant" in
    default) name="bento-$target" features="" ;;
    backend-free) name="bento-backend-free-$target" features="--no-default-features" ;;
esac
cargo build --release --locked -p bento_cli ${features:+"$features"}
bento="${CARGO_TARGET_DIR:-target}/release/bento"
build="$(xcrun vtool -show-build "$bento")"
printf '%s\n' "$build"
# crates/bento_cli/build.rs links the default build for macOS 27.0, as CI's preview asserts.
if [ "$usage_variant" = default ] && [[ "$build" != *"minos 27.0"* ]]; then
    echo "The default CLI must declare minos 27.0" >&2
    exit 1
fi
stage="$(mktemp -d)"
trap 'rm -rf "$stage"' EXIT
mkdir -p "$stage/$name" artifacts
cp "$bento" "$stage/$name/bento"
# COPYFILE_DISABLE keeps macOS from adding `._` metadata entries beside the directory.
COPYFILE_DISABLE=1 tar -czf "artifacts/$name.tar.gz" -C "$stage" "$name"
echo "artifacts/$name.tar.gz"
'''

[tasks.release]
description = "Publish the GitHub release with the archives in artifacts/ (release.yml runs this)"
# `knope release` reads GITHUB_TOKEN; Varlock checks it against .env.schema and redacts it.
# `--filter` loads that item alone, so a required item added to .env.schema later never
# blocks a release.
run = "varlock run --filter GITHUB_TOKEN -- knope release --verbose"

[hooks]
postinstall = 'ln -sfn "$(mise where github:markmals/workbench)" "{{config_root}}/.workbench"'
