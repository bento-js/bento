[package]
name = "bento_guestbook_host"
description = "Example Rust host that runs the Remix guest book with Rust-owned storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "bento-guestbook-host"
path = "src/main.rs"

[dependencies]
bento_host.workspace = true
bento_runtime.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3.18"
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
chrono = "0.4.45"
libc = "0.2.190"
tempfile.workspace = true

# Executables that embed the runtime export the Node-API symbols so the fixture's native
# compiler addons resolve them at load time.
[build-dependencies]
deno_napi.workspace = true
